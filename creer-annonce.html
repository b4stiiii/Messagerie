<!doctype html>
<html lang="fr">
    <head><meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Créer une annonce - Ma Messagerie</title>
        <link rel="stylesheet" href="styles.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
        <script src="config.js" defer></script><script src="app.js" defer></script>
    </head>
    <body data-page="creer-annonce">
        <header><a class="marque" href="index.html">Ma Messagerie</a>
            <nav aria-label="Navigation principale">
                <a href="contacts.html" data-prive>Contacts</a>
                <a href="messagerie.html" data-prive>Messagerie</a>
                <a href="marketplace.html" data-prive>Marketplace</a>
                <a href="index.html" id="lien-compte">Mon compte</a>
                <button id="deconnexion" type="button" hidden>Se déconnecter</button>
            </nav>
        </header>
        
        <div class="conteneur">
            <p id="etat" role="status">Chargement…</p>
            <main id="contenu" hidden>
                <nav class="sous-menu" aria-label="Marketplace">
                    <a href="marketplace.html">Marketplace</a>
                    <a href="creer-annonce.html">Créer une annonce</a>
                    <a href="annonces.html">Les annonces</a>
                    <a href="mes-annonces.html">Mes annonces</a>
                    <a href="classement.html">Classement</a>
                </nav>
                
                <h1>Créer une annonce</h1>
                <form id="creation" class="formulaire">
                    <label for="titre">Nom de l’objet</label>
                    <input id="titre" name="title" required maxlength="100">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" required maxlength="2000" rows="4"></textarea>
                    <label for="categorie">Catégorie</label>
                    <select id="categorie" name="category">
                        <option>Mobilier</option>
                        <option>Musique</option>
                        <option>Véhiules</option>
                        <option>Autres</option>
                    </select>
                    
                    <div class="colonnes">
                        <div><label for="prix">Prix de départ (€)</label>
                            <input id="prix" name="price" type="number" min="0.01" max="1000000" step="0.01" required>
                        </div>
                            <div><label for="duree">Durée (heures)</label>
                                <input id="duree" name="hours" type="number" min="1" max="720" step="1" value="24" required>
                            </div>
                    </div>
                        <label for="photos">Photos (facultatif)</label>
                        <input id="photos" name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
                        <p class="petit">Jusqu’à 5 photos, 5 Mo chacune, au format JPEG, PNG ou WebP.</p>
                        <button>Publier mon annonce</button>
                </form>
            </main>
        </div>
    </body>
</html>
